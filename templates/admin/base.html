
<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'fa' else 'ltr' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Qalam Nevis Admin{% endblock %}
    </title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        body[dir="rtl"] {
            font-family: 'Vazirmatn', sans-serif;
        }

        .sidebar {
            height: 100dvh;
            background-color: #042f2e;
            transition: transform 0.3s ease;
        }

        @media (max-width: 1023px) {
            .sidebar {
                transform: translateX(-100%);
            }

            html[dir="rtl"] .sidebar {
                transform: translateX(100%);
            }

            .sidebar.open,
            html[dir="rtl"] .sidebar.open {
                transform: translateX(0);
            }
        }

        @media (min-width: 1024px) {
            .sidebar {
                transform: translateX(0);
            }
        }

        .nav-link {
            transition: background 0.2s;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-link.active {
            background: rgba(255, 255, 255, 0.15);
            border-inline-start: 3px solid #fbbf24;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="min-h-screen bg-slate-50 text-slate-800">

    {% set fa = lang == "fa" %}

    <div id="site-header">
        {% include "partials/header.html" %}
    </div>

    {% include "admin/sidebar.html" %}

    <div class="{{ 'lg:mr-72' if fa else 'lg:ml-72' }} min-h-screen">
        <div class="px-5 pt-5 lg:hidden">
            <button
                type="button"
                onclick="toggleSidebar(true)"
                class="inline-flex items-center gap-2 rounded-xl
                      bg-teal-800 px-4 py-3 text-sm font-semibold text-white">

                <i data-lucide="menu" class="h-5 w-5"></i>
                {{ "منوی مدیریت" if fa else "Admin Menu" }}
            </button>
        </div>
        <main class="mx-auto max-w-7xl p-5 sm:p-8">
            {% block content %}{% endblock %}
        </main>

        <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-400">
            © 2026 Qalam Nevis —
            {{ "مرکز مدیریت" if fa else "Administration Center" }}
        </footer>
    </div>

    <div
        id="toast"
        role="status"
        aria-live="polite"
        class="fixed bottom-5 right-5 z-[60] hidden max-w-sm
               rounded-xl bg-slate-900 px-5 py-4
               text-sm text-white shadow-xl">
    </div>

    <script>

        function toggleSidebar(open) {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("overlay");

            if (!sidebar || !overlay) return;

            const mobile = window.innerWidth < 1024;
            const shouldOpen = open && mobile;

            sidebar.classList.toggle("open", shouldOpen);
            overlay.classList.toggle("hidden", !shouldOpen);
            document.body.classList.toggle("overflow-hidden", shouldOpen);
        }

        window.addEventListener("resize", () => {
            if (window.innerWidth >= 1024) {
                toggleSidebar(false);
            }
        });

        let toastTimer;

        function showToast(message) {
            const toast = document.getElementById("toast");

            toast.textContent = message;
            toast.classList.remove("hidden");

            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {
                toast.classList.add("hidden");
            }, 3500);
        }

        document.querySelectorAll("[data-height]").forEach(element => {
            element.style.height = element.dataset.height + "%";
        });

        document.querySelectorAll("[data-width]").forEach(element => {
            element.style.width = element.dataset.width + "%";
        });

        if (window.lucide) {
            lucide.createIcons();
        }
    
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
