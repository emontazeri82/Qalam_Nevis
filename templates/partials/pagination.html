{% set pagination_is_fa = lang == 'fa' %}

<div class="mt-10 border-t border-stone-300 pt-6">
  <nav
    aria-label="{{ 'پیش‌نمایش صفحه‌بندی' if pagination_is_fa
                   else 'Pagination preview' }}"
    aria-describedby="pagination-preview-note"
    class="flex flex-wrap items-center justify-center gap-2"
  >
    <button
      type="button"
      disabled
      class="cursor-not-allowed rounded-lg border border-stone-300 px-4 py-2 text-sm text-slate-500"
    >
      {{ 'قبلی' if pagination_is_fa else 'Previous' }}
    </button>

    {% for number in range(1, 4) %}
      <button
        type="button"
        disabled
        {% if number == 1 %}aria-current="page"{% endif %}
        aria-label="{{ ('صفحهٔ ' if pagination_is_fa else 'Page ') ~ number }}"
        class="h-10 min-w-10 cursor-not-allowed rounded-lg px-3 text-sm font-medium
          {{ 'bg-teal-800 text-white shadow-sm'
             if number == 1
             else 'border border-stone-300 bg-white/70 text-slate-500' }}"
      >
        {{ ['۱', '۲', '۳'][number - 1] if pagination_is_fa else number }}
      </button>
    {% endfor %}

    <button
      type="button"
      disabled
      class="cursor-not-allowed rounded-lg border border-stone-300 px-4 py-2 text-sm text-slate-500"
    >
      {{ 'بعدی' if pagination_is_fa else 'Next' }}
    </button>
  </nav>

  <p
    id="pagination-preview-note"
    class="mt-3 text-center text-xs leading-relaxed text-slate-500"
  >
    {{ 'صفحه‌بندی فعلاً فقط بخشی از پیش‌نمایش طراحی است.'
       if pagination_is_fa
       else 'Pagination is currently a design preview only.' }}
  </p>
</div>
